<!DOCTYPE html> 
	<html lang="en">  
		<head>     
			<meta charset="UTF-8">    
			<meta name="viewport" content="width=device-width, initial-scale=1.0">     
			
			<title>ExSQL</title> 
			<link rel="icon" href="data:,">

			<style>
				html, body {
					padding: 2px;
					overflow-y: scroll;
					scrollbar-width: none;
					-ms-overflow-style: none;
				}
				html::-webkit-scrollbar,
				body::-webkit-scrollbar {
					width: 0;
					height: 0;
					display: none;
				}
			</style>
		</head>  
		
		<body style="background-color: black; overflow: hidden;">     

			<div style="display: flex; flex-direction: column; align-items: left;">          
				
				<div style="display: flex; align-items: center;">              
					<div style="width: 6%; min-width: 61px;">                 
						<a style="color: white; font-size: 18px;">                     
							Script:                 
						</a>             
					</div>        

					<select title="Selects desired script"
							id="scriptSelect"                 
							style="width: 44%; font-size: 18px; padding: 4px; box-sizing: border-box;">                  
						<option value="transform.js">Transform</option>                 
						<option value="extract.js">Extract</option>
						<option value="filter.js">Filter</option>
						<option value="count.js">Count</option>                 
						<option value="replace.js">Replace</option> 
						<option value="mismatch.js">Mismatch</option>            
						<option value="duplicates.js">Duplicates</option>
						 
					</select>          
				</div> 




				<a style="margin-top: 40px;">
				</a>  


				<div style="display: flex; align-items: center;"> 
					<div style="width: 6%; min-width: 61px;">                 
						<a style="color: white; font-size: 18px;">                     
							File:                 
						</a>             
					</div> 

					<div id = "fileBlock" style="width: 44%; font-size: 18px; ">    
						
						<div style="display: flex; ">          
							<button
							id="fileButton"
							style="padding: 3px; width: 77.5%; font-size: 18px;"
							>
								Choose File						
							</button>

							<button
							title="Removes selected file"
							id="rmFile"
							style="padding: 3px; width: 20%; font-size: 15px; margin-left: 2.5%;">
							&#x232B
							</button>
						</div>



						<a style="color: white; font-size: 14px; margin-top: 2.5px; padding-left: 43%;">                     
							OR                 
						</a>     


						<div style="display: flex; margin-top: 2.5px; "> 
							<textarea
							
							id="fileInsert"
							placeholder="Insert data"
							style="padding: 3px; width: 77.5%; font-size: 18px; 
								   box-sizing: border-box;
								   max-width: 77.5%; 
								   min-width:77.5%;
								   min-height: 30px;
								   height: 30px;
								   "></textarea>

							<button
							title="Clears inserted data"
							id="rmInserted"
							style="padding: 3px; width: 20%; font-size: 15px; margin-left: 2.5%;">
							&#x232B
							</button>
						</div>

					</div>
				</div>


				 

				<div id="inputBlock" style="display: flex; align-items: center; box-sizing: border-box; margin-top: 40px;">          

					<div style="width: 6%; min-width: 61px;">                 
						<a style="color: white; font-size: 18px;">                     
							Input:                 
						</a>             
					</div>        

					<div style="width: 44%; display: flex; flex-direction: column;">

						<div id="inputs"                 
							style="width: 100%; display: flex; flex-direction: column;">                
						</div>    
							
					</div>
				</div>  


				
				
				<!-- <a style="margin-top: 40px;">
					</a> -->

				<div id="outputBlock" style="display: flex; align-items: center; margin-top: 40px;" > 
					
					               
					<div style="width: 6%; min-width: 61px;">                 
						<a style="color: white; font-size: 18px;">                     
							Output:                 
						</a>             
					</div>        

					<div style="width: 44%; display: flex; flex-direction: column;">
						<select title="Selects desired output format"
								id="format"                 
								style="font-size: 18px; padding: 4px; box-sizing: border-box;">                  
							<option value="SQL">SQL</option>                 
							<option id="optExcel" value="Excel">Excel</option>
						</select>                         

						<select
							title="SQL Output Structure"                         
							type="text"                         
							id="sqlFormat"                                       
							style="                             
							width: 100%;                             
							font-size: 18px;                             
							padding: 3px;   
							margin-top: 2.5%;                          
							box-sizing: border-box;                                
							height: 30px;               
							">   

								<option value="in">IN</option>  
								<option value="values">VALUES</option>
						</select>
					</div>
				</div>



				<a style="margin-top: 40px;">
				</a>  


				
                <div style="display: flex; align-items: center;">

                    <div style="width: calc(44% + max(6%, 61px)); font-size: 18px;">

                        <div style="display: flex; margin-top: 2.5px;">
                            <button
                                id="execute"
                                style="padding: 3px; width: 77.5%; font-size: 18px;
                                    box-sizing: border-box;">
                                Execute
                            </button>

                            <button
								title="Clears console log"
                                id="clear"
                                style="padding: 3px; width: 22.5%;
                                    font-size: 15px;
                                    margin-left: 2.5%;">
                                &Oslash;
                            </button>
                        </div>

                    </div>

                </div>



				<input                
				id="file"                 
				type="file" 
				style="width: 100%; font-size: 18px; padding: 3px;"
				hidden>

			</div>      

		<script src="../parser/parse.js"></script>
		<script src="../parser/format.js"></script>

		<script>        
		    // console.clear()
			const select = document.getElementById("scriptSelect");       
			
			const inputs = document.getElementById("inputs");         
			
			const fileBlock = document.getElementById("fileBlock");
			const fileInput = document.getElementById("file"); // always hidden, fileButton is used in its place for better styling
			const fileButton = document.getElementById("fileButton");
			const fileInsert = document.getElementById("fileInsert"); 
			const removeFile = document.getElementById("rmFile");
			const removeInserted = document.getElementById("rmInserted");

			const sqlFormat = document.getElementById("sqlFormat");
			const format = document.getElementById("format");
			const colNo = document.getElementById("columnNoInput");
			

			const execute = document.getElementById("execute");
			const clear = document.getElementById("clear");

			
			function replace(oldPattern, newPattern, data) {
				return data.replaceAll(oldPattern, newPattern);
			}

			function updateInputs() {              
				if (select.value === "count.js") {                  
					inputs.innerHTML = `                     
					<input                         
						type="text"                         
						id="countInput"                         
						placeholder="Character/word to count"                      
						style="                         
						width: 100%;                          
						font-size: 18px;                    
						padding: 3px;              			                  
						box-sizing: border-box;     
						min-height: 30px;
						height: 30px;   
						">          
					`;     
			
				} else if (select.value === "extract.js") {
					inputs.innerHTML = `                     
					<div style="display: flex;">

						<textarea
							id="extractInput"
							placeholder="e.g., ERROR:(literal space)"
							style="padding: 3px; width: 77.5%; font-size: 18px;
							box-sizing: border-box;
							max-width: 77.5%;
							min-width: 77.5%;
							min-height: 30px;
							height: 30px;
							"></textarea>

						<button
							id="rmInput"
							style="padding: 3px; width: 20%; font-size: 15px; margin-left: 2.5%;">
							&#x232B
							</button>

					</div>

					<select   
						title="desired method of extraction"                      
						type="text"                         
						id="extractBool"                                             
						style="                             
						width: 100%;                             
						font-size: 18px;                             
						padding: 3px;                             
						box-sizing: border-box;                             
						margin-top: 2.5%;       
						height: 30px;                 
						">
						<option value="minimal">Minimal</option>   
						<option value="regex">RegEx</option>  
						</select>          
					`;              	
				} else if (select.value === "replace.js") {
					inputs.innerHTML = `                     
					<input                         
						type="text"                         
						id="oldInput"                         
						placeholder="To Find"                         
						style="                             
						width: 100%;                             
						font-size: 18px;                             
						padding: 3px;                             
						box-sizing: border-box;   
						min-height: 30px;
						height: 30px;                      
						">                      

					<input                         
						type="text"                         
						id="newInput"                         
						placeholder="Replace with"                         
						style="                             
						width: 100%;                             
						font-size: 18px;                             
						padding: 3px;                             
						box-sizing: border-box;                             
						margin-top: 2.5%;                        
						">                 
					`;    

				} else if (select.value === "transform.js") {                  
					inputs.innerHTML = `           
					<input                         
						type="text"                         
						id="structureInput"                         
						placeholder="(optional) Cols. wanted, e.g., 1,3,4 or 3,1,3,4"                         
						style=" width: 100%; font-size: 18px; padding: 3px; box-sizing: border-box; 
						min-height: 30px;
						height: 30px;
						">    
					`;
					// optExcel.style.display = "none";
					
				} else if (select.value === "filter.js") {                  
					inputs.innerHTML = ` 
					<div style="display: flex;">
						<textarea
							id="filterInput"
							placeholder="Items to except"
							style="padding: 3px; width: 77.5%; font-size: 18px;
							box-sizing: border-box;
							max-width: 77.5%;
							min-width: 77.5%;
							min-height: 30px;
							height: 30px;
							"></textarea>

						<button
							id="rmInput"
							style="padding: 3px; width: 20%; font-size: 15px; margin-left: 2.5%;">
							&#x232B
							</button>
					</div>

					<input                         
						type="text"                    
						id="columnNoInput"                         
						placeholder="Number of column filtered by, e.g., 4"                         
						style="                             
						width: 100%;                             
						font-size: 18px;                             
						padding: 3px;                             
						box-sizing: border-box;                             
						margin-top: 2.5%;                         
						"
						hidden
						>       
					`;      

				} else if (select.value === "duplicates.js") {                  
					inputs.innerHTML = `
					`;             
				} else if (select.value === "mismatch.js") {                  
					inputs.innerHTML = `
					<textarea
						id="matchInput"
						placeholder="Match against"
						style="padding: 3px; width: 77.5%; font-size: 18px;
						box-sizing: border-box;
						max-width: 100%;
						min-width: 100%;
						min-height: 30px;
						height: 30px;
						"></textarea>
					`;             
				}
			}     



			function checkFormat() {
				if (format.value === "Excel" || outputBlock.style.display === "none") { 
					sqlFormat.hidden = true;
					} else {
					sqlFormat.hidden = false;
				};
			};

			select.addEventListener("change", () => {             
				updateInputs();
				
				const outputBlock = document.getElementById("outputBlock");
				const inputBlock = document.getElementById("inputBlock");
				const exceptions = ['count.js', 'replace.js']; // no output block
				const exceptions2 = ['duplicates.js']; // no input block

				if (exceptions.includes(select.value)) { 
					outputBlock.style.display = "none";
					inputBlock.style.display = 'flex';
					checkFormat()

				} else if (exceptions2.includes(select.value)) {
					inputBlock.style.display = "none";
					outputBlock.style.display = 'flex';
					checkFormat()
				} else {
					outputBlock.style.display = "flex";
					inputBlock.style.display = "flex";
					checkFormat()
				};
			});

			format.addEventListener("change", () => {
				checkFormat()
			});


			fileButton.addEventListener("click", () => {
				fileInput.click();
			})
			
			fileInput.addEventListener("change", async () => {              
				const file = fileInput.files?.[0];    

				if (!file) {return}              
				
				const data = await file.text();
				
				console.log("Uploaded File:")
				console.log(data);
				
				if (file) {
					fileButton.textContent = file.name;
				}
			});          

			removeFile.addEventListener("click", () => {
				fileInput.value = '';
				fileButton.textContent = 'Choose File';
			})

			removeInserted.addEventListener("click", () => {
				fileInsert.value = '';
			})


			

			// for extract.js, changes the placeholder of the input field based on the selected extraction method
			const observer = new MutationObserver(() => {
				const regexSelect = document.getElementById("extractBool");
				
				if (regexSelect) { 
					const inputPlaceholder = document.getElementById("extractInput");

					regexSelect.addEventListener( "change", () => {
						if (regexSelect.value === "regex") {
							inputPlaceholder.placeholder = "e.g., /ERROR:\\s(\\S+)/g";
						} else {
							inputPlaceholder.placeholder = "e.g., ERROR:(literal space)";
						}   	
					});
				}
			}); 
			observer.observe(document.body, {
				childList: true,
				subtree: true
			});



			// for extract.js and filter.js, adds a click event listener to the remove button to clear the input field
			const observer2 = new MutationObserver(() => {
				const eI = document.getElementById("extractInput");
				const fI = document.getElementById("filterInput");

				if (eI || fI) { 
					const removeInput = document.getElementById("rmInput");
					removeInput.addEventListener("click", () => {
						if (eI) {
							eI.value = '';
						} else {
							fI.value = '';
						}
					});
				}
			});
			observer2.observe(document.body, {
				childList: true,
				subtree: true
			});

			// for filter.js, shows or hides the column number input field based on selected SQL output structure
			const observer3 = new MutationObserver(() => {
				const colNo = document.getElementById("columnNoInput");

				if (colNo) { 
					// initial load
					if (sqlFormat.value === 'values') {
						colNo.hidden = false;
					} else {
						colNo.hidden = true;
					}

					// any further changes
					sqlFormat.addEventListener("change", () => {
						if (sqlFormat.value === 'values') {
							colNo.hidden = false;
						} else {
							colNo.hidden = true;
						}
					});
				}
			});
			observer3.observe(document.body, {
				childList: true,
				subtree: true
			});


			execute.addEventListener("click", () => {
				const script = document.createElement("script");

				script.src = `../scripts/${select.value}`;
				console.log("Script Output:")
				document.body.appendChild(script);
			})

			clear.addEventListener("click", () => {
				console.clear();
			})

			updateInputs();      
		</script> 

		</body>  

	</html>
